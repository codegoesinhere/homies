</section><script>
(function () {
  function applyOneBedRedFlagDefault() {
    var inputs = Array.from(document.querySelectorAll('input[type="checkbox"]'));
    inputs
      .filter(function (input) {
        var text = [
          input.id || '',
          input.name || '',
          input.value || '',
          input.getAttribute('aria-label') || '',
          input.closest('label') ? input.closest('label').innerText : '',
          input.parentElement ? input.parentElement.innerText : ''
        ].join(' ').toLowerCase();
        return text.includes('red flag') || text.includes('red-flag') || text.includes('redflag') || text.includes('excluded');
      })
      .forEach(function (input) {
        input.checked = false;
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      });
  }

  window.addEventListener('load', function () {
    applyOneBedRedFlagDefault();
    window.setTimeout(applyOneBedRedFlagDefault, 100);
    window.setTimeout(applyOneBedRedFlagDefault, 500);
  });
})();
</script>
